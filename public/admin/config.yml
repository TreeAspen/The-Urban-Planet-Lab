# ─────────────────────────────────────────────────────────────────────────────
# Decap CMS Configuration — The Urban Planet Lab
#
# SETUP REQUIRED (two values to fill in before this works):
#   1. Replace GITHUB_USERNAME with your actual GitHub username
#   2. Replace NETLIFY_OAUTH_PROXY_URL with the URL of your Netlify OAuth proxy
#      (see OAUTH_SETUP.md at the root of this repo for step-by-step instructions)
# ─────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: treeaspen/The-Urban-Planet-Lab  # 请确认这是你正确的 GitHub 用户名和仓库名
  branch: main
  base_url: https://the-urban-planet-lab-git-main-treeaspens-projects.vercel.app
  auth_endpoint: api/auth

# Images are stored in public/uploads/ and referenced as /uploads/...
media_folder: "public/uploads"
public_folder: "/uploads"

locale: "en"

collections:

  # ── Singleton Pages ─────────────────────────────────────────────────────────
  - name: "pages"
    label: "Pages"
    files:

      - name: "settings"
        label: "⚙️ Site Settings"
        file: "content/pages/settings.json"
        fields:
          - label: "Background Style"
            name: "background"
            widget: "select"
            default: "urbanheat"
            hint: "Decorative background shown behind every page. 'Urban Heat' gives a thermal day/night identity."
            options:
              - { label: "Urban Heat — thermal day / night (signature)", value: "urbanheat" }
              - { label: "Mesh — colourful soft gradients (modern)", value: "mesh" }
              - { label: "Aurora — slow drifting blobs", value: "aurora" }
              - { label: "Dots — subtle dotted texture", value: "dots" }
              - { label: "Grid — minimal blueprint lines", value: "grid" }
              - { label: "Glow — single clean centre glow", value: "glow" }
              - { label: "Plain — smooth gradient, no texture", value: "plain" }
          - label: "Research page — show a figure for each direction"
            name: "research_images"
            widget: "boolean"
            default: false
            required: false
            hint: "OFF (default) keeps the Research page text-only — figures live on the Projects page. Turn it ON to show each direction's image, or a placeholder tile where no image has been uploaded yet."
          - label: "Visible Sections (turn a switch OFF to hide that section)"
            name: "sections"
            widget: "object"
            collapsed: false
            hint: "Each switch shows/hides a whole section across the site — its nav link, its cross-page links, and its own page. For example, switch News OFF to hide the News module everywhere."
            fields:
              - { label: "Research — show in site", name: "research", widget: "boolean", default: true }
              - { label: "Projects — show in site", name: "projects", widget: "boolean", default: true }
              - { label: "Publications — show in site", name: "publications", widget: "boolean", default: true }
              - { label: "People — show in site", name: "people", widget: "boolean", default: true }
              - { label: "News — show in site (OFF = hide the News module)", name: "news", widget: "boolean", default: true }
              - { label: "Blog — show in site", name: "blog", widget: "boolean", default: true }
              - { label: "Courses — show in site", name: "teaching", widget: "boolean", default: true }
              - { label: "Home page — Meaningful Places map", name: "home_places", widget: "boolean", default: true }

      - name: "home"
        label: "🏠 Home Page"
        file: "content/pages/home.json"
        fields:
          - label: "Tagline (above main heading)"
            name: "tagline"
            widget: "string"
            hint: "Short tagline shown above the title, e.g. 'Urban Sustainability · Environmental Justice'"
          - label: "Main Heading"
            name: "main_heading"
            widget: "string"
            hint: "The large title displayed on the homepage"
          - label: "Description Paragraph"
            name: "description"
            widget: "markdown"
            hint: "The FIRST paragraph is set large and bold as the lab's opening statement; everything after it is normal body text — so keep the first paragraph to a sentence or two. You can add links (e.g. CUSP, MAE) with the link button; they appear underlined on the site."
          - label: "Hero Image"
            name: "hero_image"
            widget: "image"
            required: false
            hint: "Full-width banner at the very top of the homepage — it parallaxes and fades out as visitors scroll. A wide panorama works best (roughly 2:1 or wider, at least 2000px across)."
          - label: "Hero Image Alt Text"
            name: "hero_image_alt"
            widget: "string"
            required: false
            hint: "Accessibility description of the hero image (required if image is set)"
          - label: "Feature Cards"
            name: "cards"
            widget: "list"
            hint: "Up to 3 highlight cards shown below the description paragraph"
            add_to_top: false
            fields:
              - { label: "Card Title", name: "title", widget: "string" }
              - { label: "Card Description", name: "description", widget: "text" }

      - name: "research"
        label: "🔬 Research Page"
        file: "content/pages/research.json"
        fields:
          - label: "Main Heading"
            name: "main_heading"
            widget: "string"
          - label: "Intro Description"
            name: "description"
            widget: "text"
            hint: "Paragraph inside the top banner panel"
          - label: "Hero Image"
            name: "hero_image"
            widget: "image"
            required: false
            hint: "Optional banner image (recommended: 1600×900px)"
          - label: "Hero Image Alt Text"
            name: "hero_image_alt"
            widget: "string"
            required: false
          - label: "Research Directions Section Title"
            name: "section_title"
            widget: "string"
            hint: "Heading above the research directions list, e.g. 'Research Directions'"
          - label: "Research Directions Section Description"
            name: "section_description"
            widget: "text"
            hint: "Short paragraph introducing the list of research directions"
          - label: "Closing Statement"
            name: "closing_statement"
            widget: "text"
            required: false
            hint: "Optional quote or statement shown at the bottom of the page"

      - name: "projects_page"
        label: "🧭 Projects Page"
        file: "content/pages/projects.json"
        fields:
          - label: "Main Heading"
            name: "main_heading"
            widget: "string"
          - label: "Intro Description"
            name: "description"
            widget: "text"
            hint: "Paragraph below the page title"
          - label: "Closing Statement"
            name: "closing_statement"
            widget: "text"
            required: false
            hint: "Optional statement shown at the bottom of the Projects page"

      - name: "news_page"
        label: "📰 News Page (lab photo)"
        file: "content/pages/news.json"
        fields:
          - label: "Lab Photo"
            name: "lab_photo"
            widget: "image"
            required: false
            hint: "Group photo of the lab, shown at the top of the News page (recommended: 16:7 ratio). Leave empty to show a blank placeholder."
          - label: "Lab Photo Alt Text"
            name: "lab_photo_alt"
            widget: "string"
            required: false
          - label: "Lab Photo Caption"
            name: "lab_photo_caption"
            widget: "string"
            required: false

  # ── Research Directions ─────────────────────────────────────────────────────
  - name: "research_directions"
    label: "🔬 Research Directions"
    folder: "content/research-directions"
    create: true
    slug: "{{fields.index}}-{{title}}"
    summary: "{{fields.index}}. {{fields.title}}"
    fields:
      - label: "Display Order"
        name: "index"
        widget: "number"
        value_type: "int"
        min: 1
        hint: "Determines the display order (1 = first). Each direction should have a unique number."
      - label: "Direction Title"
        name: "title"
        widget: "string"
        hint: "Short, memorable name for this research direction"
      - label: "Description"
        name: "description"
        widget: "text"
        hint: "One to two paragraphs explaining what this direction covers and why it matters"
      - label: "Direction Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Banner shown at the top of this direction on the Research page. Wide landscape works best (16:7 or wider, at least 1200px). Leave empty and a themed placeholder tile is used instead."
      - label: "Direction Image Alt Text"
        name: "image_alt"
        widget: "string"
        required: false
        hint: "Accessibility description of the image"
      - label: "Selected Papers (max 3)"
        name: "publications"
        widget: "list"
        required: false
        max: 3
        hint: "Pick up to 3 papers. They appear under this direction on the Research page, and this is also what groups papers by direction on the Publications page. Fewer than 3 is fine."
        field:
          label: "Publication"
          name: "publication"
          widget: "relation"
          collection: "publications"
          search_fields: ["title", "authors", "year"]
          value_field: "{{slug}}"
          display_fields: ["{{year}} — {{title}}"]

  # ── Projects ────────────────────────────────────────────────────────────────
  - name: "projects"
    label: "🧭 Projects"
    folder: "content/projects"
    create: true
    slug: "{{fields.order}}-{{title}}"
    summary: "{{fields.order}}. {{fields.title}} ({{fields.status}})"
    fields:
      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        min: 1
        hint: "1 = first on the Projects page"
      - label: "Project Title"
        name: "title"
        widget: "string"
      - label: "Tagline"
        name: "tagline"
        widget: "string"
        required: false
        hint: "One line shown in italics under the title"
      - label: "Status"
        name: "status"
        widget: "string"
        required: false
        hint: "e.g. Ongoing, Foundational, Completed"
      - label: "Period"
        name: "period"
        widget: "string"
        required: false
        hint: "e.g. 2023 – present. Leave empty to hide."
      - label: "Description"
        name: "description"
        widget: "text"
        hint: "One paragraph on what this project does and why it matters"
      - label: "Research Direction"
        name: "direction"
        widget: "relation"
        required: false
        collection: "research_directions"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["{{title}}"]
        hint: "Which research direction this project belongs to — shown as a link at the bottom of the project"
      - label: "Partners"
        name: "partners"
        widget: "string"
        required: false
        hint: "Funders and collaborating institutions, separated by ' · '"
      - label: "Project Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Shown on the Projects page and at the top of this project's own page. Landscape works best (4:3 or 16:9, at least 1200px wide). Leave empty and a themed placeholder tile is used instead."
      - label: "Project Image Alt Text"
        name: "image_alt"
        widget: "string"
        required: false
        hint: "Accessibility description of the image"
      - label: "Selected Papers (max 3)"
        name: "publications"
        widget: "list"
        required: false
        max: 3
        field:
          label: "Publication"
          name: "publication"
          widget: "relation"
          collection: "publications"
          search_fields: ["title", "authors", "year"]
          value_field: "{{slug}}"
          display_fields: ["{{year}} — {{title}}"]
      - label: "Full Write-up (project's own page)"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Optional long-form text shown on this project's own page, below the description. Leave empty and the page just shows the description."

  # ── People ──────────────────────────────────────────────────────────────────
  - name: "people"
    label: "👥 People"
    folder: "content/people"
    create: true
    slug: "{{fields.category}}-{{fields.name | slugify}}"
    summary: "{{fields.name}} — {{fields.role}} ({{fields.category}})"
    fields:
      - label: "Full Name"
        name: "name"
        widget: "string"
        hint: "Up to 3 contact links are shown publicly, in priority order: Website, Email, LinkedIn, Google Scholar, Twitter/X — fill in only the ones you want visitors to see."
      - label: "Category"
        name: "category"
        widget: "select"
        hint: "Which group this person belongs to"
        options:
          - { label: "Faculty", value: "faculty" }
          - { label: "PhD Student", value: "phd" }
          - { label: "Master Student", value: "master" }
          - { label: "Undergraduate Student", value: "undergrad" }
          - { label: "High School Student", value: "highschool" }
          - { label: "Lab Collaborator", value: "external" }
          - { label: "Alumni", value: "alumni" }
      - label: "Role / Title"
        name: "role"
        widget: "string"
        hint: "e.g. 'Associate Professor', 'PhD Candidate', 'MS Student', 'PhD 2023 → Postdoc at MIT'"
      - label: "Photo"
        name: "photo"
        widget: "image"
        required: false
        hint: "Headshot (recommended: square, at least 400×400px)"
      - label: "Short Bio (People page)"
        name: "bio"
        widget: "text"
        required: false
        hint: "1–3 sentences shown on the People list. Keep it short — the long version below is separate."
      - label: "Full Bio (individual profile page — Faculty only)"
        name: "body"
        widget: "markdown"
        required: false
        hint: "The long biography shown on the faculty member's own page. Only Faculty have an individual page. If left empty, that page falls back to the short bio."
      - label: "Email"
        name: "email"
        widget: "string"
        required: false
      - label: "Personal Website URL"
        name: "website"
        widget: "string"
        required: false
        hint: "Full URL including https://"
      - label: "Google Scholar URL"
        name: "scholar"
        widget: "string"
        required: false
        hint: "Full URL to Google Scholar profile"
      - label: "LinkedIn URL"
        name: "linkedin"
        widget: "string"
        required: false
        hint: "Full URL to LinkedIn profile, e.g. https://www.linkedin.com/in/..."
      - label: "Twitter / X Handle"
        name: "twitter"
        widget: "string"
        required: false
        hint: "Handle without the @ symbol, e.g. 'urbanplanetlab'"
      - label: "Display Order (within category)"
        name: "sort_order"
        widget: "number"
        value_type: "int"
        default: 99
        hint: "Lower numbers appear first within each category group"

  # ── Publications ────────────────────────────────────────────────────────────
  - name: "publications"
    label: "📄 Publications"
    folder: "content/publications"
    create: true
    slug: "{{fields.year}}-{{title}}"
    summary: "{{fields.year}} — {{fields.title}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Authors"
        name: "authors"
        widget: "string"
        hint: "e.g. 'Doe, J., Smith, A., & Lee, C.'"
      - label: "Journal / Venue"
        name: "venue"
        widget: "string"
        hint: "Full journal name, conference name, or book title"
      - label: "Year"
        name: "year"
        widget: "number"
        value_type: "int"
        min: 1990
      - label: "Volume / Issue / Pages"
        name: "details"
        widget: "string"
        required: false
        hint: "e.g. '12(3), 145–168' or 'Article 104721'"
      - label: "Publication Type"
        name: "pub_type"
        widget: "select"
        required: false
        options:
          - { label: "Journal Article", value: "journal" }
          - { label: "Conference Paper", value: "conference" }
          - { label: "Book Chapter", value: "book_chapter" }
          - { label: "Report / Working Paper", value: "report" }
      - label: "DOI / Link"
        name: "doi_url"
        widget: "string"
        required: false
        hint: "Full URL, e.g. https://doi.org/10.1038/..."
      - label: "PDF Download URL"
        name: "pdf_url"
        widget: "string"
        required: false
        hint: "Direct link to an open-access PDF if available"
      - label: "Abstract"
        name: "abstract"
        widget: "text"
        required: false
      - label: "Tags (internal keywords)"
        name: "tags"
        widget: "list"
        required: false
        hint: "Not shown on the site. Papers are grouped on the Publications page by research direction — add a paper to a direction under 🔬 Research Directions → Selected Papers."

  # ── News ────────────────────────────────────────────────────────────────────
  - name: "news"
    label: "📰 News"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    summary: "{{fields.date}} — {{fields.title}}"
    fields:
      - label: "Headline"
        name: "title"
        widget: "string"
      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "Publication date of this news item"
      - label: "Summary"
        name: "summary"
        widget: "text"
        hint: "2–4 sentence summary shown on the news card"
      - label: "Cover Image"
        name: "cover_image"
        widget: "image"
        required: false
        hint: "Optional image shown on the news card (recommended: 16:9 ratio)"
      - label: "Cover Image Alt Text"
        name: "cover_image_alt"
        widget: "string"
        required: false
      - label: "External Link"
        name: "link"
        widget: "string"
        required: false
        hint: "Optional URL — clicking the card will open this link in a new tab"
      - label: "Featured (pin to top)"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Featured items appear before regular items regardless of date"

  # ── Blog ────────────────────────────────────────────────────────────────────
  - name: "blog"
    label: "📝 Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    summary: "{{fields.date}} — {{fields.title}} ({{fields.post_type}})"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Author"
        name: "author"
        widget: "string"
        required: false
        hint: "Name shown as the author, e.g. 'Shu Yang'"
      - label: "Post Type"
        name: "post_type"
        widget: "select"
        default: "long"
        hint: "Long-form gets its own page with the full article below. Quick update behaves like a News card — no dedicated page."
        options:
          - { label: "Long-form post (has its own page)", value: "long" }
          - { label: "Quick update (card only, like News)", value: "card" }
      - label: "Summary"
        name: "summary"
        widget: "text"
        hint: "1–3 sentence summary shown on the blog card (and below the title on long-form pages)"
      - label: "Cover Image"
        name: "cover_image"
        widget: "image"
        required: false
        hint: "Optional image shown on the card and at the top of the article (recommended: 16:9 ratio)"
      - label: "Cover Image Alt Text"
        name: "cover_image_alt"
        widget: "string"
        required: false
      - label: "External Link (Quick updates only)"
        name: "external_link"
        widget: "string"
        required: false
        hint: "Only used when Post Type is 'Quick update' — clicking the card opens this link in a new tab"
      - label: "Featured (pin to top)"
        name: "featured"
        widget: "boolean"
        default: false
      - label: "Article Content (Long-form posts only)"
        name: "body"
        widget: "markdown"
        required: false
        hint: "The full article — only used and shown when Post Type is 'Long-form post'"

  # ── Teaching / Courses ──────────────────────────────────────────────────────
  - name: "courses"
    label: "🎓 Courses"
    folder: "content/courses"
    create: true
    slug: "{{fields.sort_order}}-{{fields.code | slugify}}"
    summary: "{{fields.code}} — {{fields.name}} ({{fields.semester}})"
    fields:
      - label: "Course Code"
        name: "code"
        widget: "string"
        hint: "e.g. URPL 6210"
      - label: "Course Name"
        name: "name"
        widget: "string"
      - label: "Semester / Term"
        name: "semester"
        widget: "string"
        hint: "e.g. Fall 2024, Spring 2025"
      - label: "Course Description"
        name: "description"
        widget: "text"
        hint: "2–4 sentences describing the course content and learning objectives"
      - label: "Syllabus — Link"
        name: "syllabus_url"
        widget: "string"
        required: false
        hint: "Link to an online syllabus (Google Drive, course website, etc.)"
      - label: "Syllabus — Upload PDF"
        name: "syllabus_file"
        widget: "file"
        required: false
        media_library:
          config:
            multiple: false
        hint: "Upload a syllabus PDF instead of linking. If both are filled in, the uploaded file wins. With neither, the button still shows but does nothing."
      - label: "Display Order"
        name: "sort_order"
        widget: "number"
        value_type: "int"
        default: 99
        hint: "Lower numbers appear first on the Teaching page"

  # ── Meaningful Places ───────────────────────────────────────────────────────
  - name: "places"
    label: "📍 Meaningful Places"
    folder: "content/places"
    create: true
    slug: "{{fields.member_name | slugify}}-{{fields.place_name | slugify}}"
    summary: "{{fields.member_name}} — {{fields.place_name}} ({{fields.year}})"
    fields:
      - label: "This is the lab office"
        name: "is_office"
        widget: "boolean"
        default: false
        required: false
        hint: "ON = pinned first on the homepage map and shown as a blue 'office' pin instead of a personal place."
      - label: "Your Name"
        name: "member_name"
        widget: "string"
        hint: "The lab member this place belongs to (e.g. 'Dr. Jane Doe')"
      - label: "Place Name"
        name: "place_name"
        widget: "string"
        hint: "Short name of the place, e.g. 'Washington Square Park'"
      - label: "Location Label"
        name: "location_label"
        widget: "string"
        required: false
        hint: "City and country, e.g. 'New York, USA'"
      - label: "Latitude"
        name: "lat"
        widget: "number"
        value_type: "float"
        step: 0.0001
        hint: "Decimal degrees. Tip: in Google Maps, right-click the spot → click the coordinates to copy. The first number is the latitude."
      - label: "Longitude"
        name: "lng"
        widget: "number"
        value_type: "float"
        step: 0.0001
        hint: "Decimal degrees. The second number from Google Maps."
      - label: "Year"
        name: "year"
        widget: "number"
        value_type: "int"
        required: false
        hint: "When this place became meaningful to you"
      - label: "Why it matters"
        name: "story"
        widget: "text"
        hint: "1–3 sentences on why this place is meaningful to you and your work"
      - label: "Photo"
        name: "photo"
        widget: "image"
        required: false
        hint: "Optional photo of the place"
